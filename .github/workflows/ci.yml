name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "**.md"
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore DeskDig.sln
      - name: Build
        run: dotnet build DeskDig.sln -c Release --no-restore
      - name: Test
        run: dotnet test tests/DeskDig.Core.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
